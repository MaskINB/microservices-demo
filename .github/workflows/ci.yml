name: CI

on:
  pull_request:
    branches: [main]

jobs:
  terraform-checks:
    name: Terraform Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - adservice
          - cartservice/src
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
          - shoppingassistantservice
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/${{ matrix.service }}/Dockerfile
          failure-threshold: error

  build-and-scan:
    name: Build & Scan Images
    runs-on: ubuntu-latest
    needs: [terraform-checks, dockerfile-lint]
    strategy:
      matrix:
        include:
          - name: adservice
            context: src/adservice
          - name: cartservice
            context: src/cartservice/src
          - name: checkoutservice
            context: src/checkoutservice
          - name: currencyservice
            context: src/currencyservice
          - name: emailservice
            context: src/emailservice
          - name: frontend
            context: src/frontend
          - name: loadgenerator
            context: src/loadgenerator
          - name: paymentservice
            context: src/paymentservice
          - name: productcatalogservice
            context: src/productcatalogservice
          - name: recommendationservice
            context: src/recommendationservice
          - name: shippingservice
            context: src/shippingservice
          - name: shoppingassistantservice
            context: src/shoppingassistantservice
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ matrix.name }}:${{ github.sha }} ${{ matrix.context }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
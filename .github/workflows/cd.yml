name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

jobs:
  build-push-deploy:
    name: Build, Push & Update Manifest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: adservice
            context: src/adservice
          - name: cartservice
            context: src/cartservice/src
          - name: checkoutservice
            context: src/checkoutservice
          - name: currencyservice
            context: src/currencyservice
          - name: emailservice
            context: src/emailservice
          - name: frontend
            context: src/frontend
          - name: loadgenerator
            context: src/loadgenerator
          - name: paymentservice
            context: src/paymentservice
          - name: productcatalogservice
            context: src/productcatalogservice
          - name: recommendationservice
            context: src/recommendationservice
          - name: shippingservice
            context: src/shippingservice
          - name: shoppingassistantservice
            context: src/shoppingassistantservice
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::271033481922:role/github-actions-cd-role
          aws-region: ap-south-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | \
          docker login --username AWS --password-stdin 271033481922.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build and push image
        run: |
          docker build -t ${{ matrix.name }}:${{ github.sha }} ${{ matrix.context }}
          docker tag ${{ matrix.name }}:${{ github.sha }} 271033481922.dkr.ecr.ap-south-1.amazonaws.com/${{ matrix.name }}:${{ github.sha }}
          docker push 271033481922.dkr.ecr.ap-south-1.amazonaws.com/${{ matrix.name }}:${{ github.sha }}

  update-manifest:
    name: Update Helm values with new image tags
    runs-on: ubuntu-latest
    needs: build-push-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in values.yaml
        run: |
          SHA=${{ github.sha }}
          sed -i "s/tag: latest/tag: \"$SHA\"/g" k8s/onlineboutique/values.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/onlineboutique/values.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
          git push
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onlineboutique
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MaskINB/microservices-demo.git
    targetRevision: main
    path: k8s/onlineboutique

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
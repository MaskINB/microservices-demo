{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image }}:{{ $svc.tag }}"
          {{- if ne $svc.protocol "none" }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- end }}
          {{- if $svc.env }}
          env:
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          {{- if eq $svc.protocol "http" }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- else if eq $svc.protocol "grpc" }}
          readinessProbe:
            grpc:
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
---
{{- end }}
